<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lift Run</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#10131c">
<link rel="icon" href="/icon-192.png">
<style>
:root{--bg:#10131c;--panel:rgba(10,12,20,.94);--gold:#ffc83d;--red:#ff4d4d;--mint:#4fe3b0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:700;pointer-events:none}
#hud span{background:var(--panel);padding:6px 9px;border-radius:10px}
#toast{position:absolute;top:96px;left:0;right:0;text-align:center;font-weight:800;font-size:20px;color:var(--gold);text-shadow:0 2px 6px #000;pointer-events:none}
#ctl{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:space-between;padding:0 14px}
.pad{display:grid;grid-template-columns:repeat(2,72px);gap:10px}
.b{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:28px}
.b:active{background:rgba(255,200,61,.5)}
#mbar{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);left:12px;right:12px;text-align:center;font-size:12px;opacity:.9;pointer-events:none}
.ov{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;overflow:auto}
.ov h1{margin:0;font-size:34px;color:var(--red)}
.ov p{margin:0;line-height:1.7;font-size:15px;max-width:330px}
.hide{display:none!important}
input,button.m{font:inherit;font-size:17px;border-radius:12px;border:0;padding:12px 18px}
input{background:#fff;color:#000;text-align:center;width:220px}
button.m{background:var(--gold);color:#1b1300;font-weight:800;cursor:pointer}
button.m:disabled{opacity:.4}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.08);padding:10px 12px;border-radius:12px;width:100%;max-width:340px;font-size:14px}
.row b{display:block}
small{opacity:.7;font-size:12px}
</style>
</head>
<body>
<div id="app">
<canvas id="cv"></canvas>
<div id="hud"><span id="hLvl">المرحلة 1</span><span id="hPl">👥 0/20</span><span id="hXp">⭐ 0</span><span><a id="hSk" style="color:#fff;pointer-events:auto" href="#">🛠 المهارات</a></span></div>
<div id="toast"></div>
<div id="mbar"></div>
<div id="ctl" class="hide">
  <div class="pad"><button class="b" id="bL">◀</button><button class="b" id="bR">▶</button></div>
  <div class="pad"><button class="b" id="bU">▲</button><button class="b" id="bD">▼</button></div>
</div>
<div class="ov" id="menu">
  <h1>LIFT RUN 👹</h1>
  <p>هرب من الوحش، قفز بين الممرات، نقز صحابك الغارقين، ودخل للسانسور باش تدوز للمرحلة الجاية. اللعبة ما فيها نهاية!</p>
  <input id="nm" maxlength="12" placeholder="سميتك">
  <button class="m" id="play">العب</button>
  <small id="msg"></small>
</div>
<div class="ov hide" id="skp"></div>
</div>
<script>
(function(){
'use strict';
var SERVER_URL=location.origin;
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
var $=function(i){return document.getElementById(i)};
// ---------- progression (local save) ----------
var SK=[['speed','🏃 السرعة'],['jump','🦘 القفز بين الممرات'],['rescue','🤝 الإنقاذ السريع'],['shield','🛡 الدرع'],['stealth','🥷 التخفي']];
var save={name:'',xp:0,done:0,unlocked:['speed','jump'],skills:{speed:1,jump:1,rescue:0,shield:0,stealth:0},mission:null};
try{var sv=JSON.parse(localStorage.getItem('liftrun')||'null');if(sv&&sv.skills)save=sv}catch(e){}
function persist(){try{localStorage.setItem('liftrun',JSON.stringify(save))}catch(e){}}
var MT={revive:['نقز',' صحاب غارقين'],lift:['دخل للسانسور',' مرات'],run:['اجري',' متر'],survive:['بقا حي',' ثانية']};
function newMission(){
  var types=['revive','lift','run','survive'],t=types[(Math.random()*4)|0],k=save.done,g;
  g=t==='revive'?1+((k/3)|0):t==='lift'?1+((k/4)|0):t==='run'?600+k*80:30+k*5;
  save.mission={t:t,g:g,p:0,xp:10+k*2};persist();
}
if(!save.mission)newMission();
function progress(t,n){
  var m=save.mission;if(!m||m.t!==t)return;
  m.p+=n;
  if(m.p>=m.g){
    save.xp+=m.xp;save.done++;
    var lock=SK.filter(function(s){return save.unlocked.indexOf(s[0])<0})[0],txt='✅ مهمة كاملة +'+m.xp+' ⭐';
    if(lock){save.unlocked.push(lock[0]);save.skills[lock[0]]=1;txt+=' | مهارة جديدة: '+lock[1];sendSkills()}
    toast(txt);newMission();
  }
  persist();hud();
}
function missionText(){var m=save.mission,d=MT[m.t];return 'المهمة: '+d[0]+' '+m.g+d[1]+' ('+Math.min(m.p|0,m.g)+'/'+m.g+')'}
// ---------- UI ----------
var toastT;function toast(t){var e=$('toast');e.textContent=t;clearTimeout(toastT);toastT=setTimeout(function(){e.textContent=''},2600)}
function hud(){$('hXp').textContent='⭐ '+save.xp;$('mbar').textContent=missionText();$('hLvl').textContent='المرحلة '+lvl;$('hPl').textContent='👥 '+count+'/20'}
function skillPanel(){
  var h='<h1 style="font-size:26px;color:#ffc83d">🛠 المهارات</h1><small>⭐ '+save.xp+' | كمل المهام باش تفتح مهارات جداد</small>';
  SK.forEach(function(s){
    var u=save.unlocked.indexOf(s[0])>=0,l=save.skills[s[0]]||0,c=15*(l+1);
    h+='<div class="row"><div><b>'+s[1]+'</b><small>'+(u?'المستوى '+l+'/5':'🔒 مقفلة')+'</small></div>'+
    (u?'<button class="m" data-k="'+s[0]+'" '+((l>=5||save.xp<c)?'disabled':'')+'>'+(l>=5?'MAX':'ترقية '+c+'⭐')+'</button>':'')+'</div>';
  });
  h+='<div class="row"><div>'+missionText()+'</div></div><button class="m" id="skx">رجع</button>';
  $('skp').innerHTML=h;
  $('skx').onclick=function(){$('skp').classList.add('hide')};
  Array.prototype.forEach.call($('skp').querySelectorAll('[data-k]'),function(b){
    b.onclick=function(){var k=b.getAttribute('data-k'),l=save.skills[k],c=15*(l+1);
      if(save.xp>=c&&l<5){save.xp-=c;save.skills[k]=l+1;persist();sendSkills();hud();skillPanel()}};
  });
}
$('hSk').onclick=function(e){e.preventDefault();skillPanel();$('skp').classList.remove('hide')};
// ---------- network ----------
var sock=null,myId=null,WORLD=1400,LANES=3,lvl=1,count=0,ent={},mon={x:600,l:1,rx:600,rl:1},joined=false;
function sendSkills(){if(sock)sock.emit('skills',save.skills)}
function connect(){
  $('msg').textContent='كنتصل بالسيرفر...';
  var s=document.createElement('script');s.src=(SERVER_URL||'')+'/socket.io/socket.io.js';
  s.onerror=function(){$('msg').textContent='ما قدرتش نتصل بالسيرفر. تأكد من config.js'};
  s.onload=function(){
    sock=io(SERVER_URL,{transports:['websocket','polling']});
    sock.on('connect',function(){sock.emit('join',{name:save.name,skills:save.skills})});
    sock.on('connect_error',function(){$('msg').textContent='السيرفر ما جاوبش...'});
    sock.on('joined',function(d){myId=d.id;WORLD=d.world;LANES=d.lanes;lvl=d.lvl;joined=true;$('menu').classList.add('hide');$('ctl').classList.remove('hide');hud()});
    sock.on('level',function(l){lvl=l;toast('🛗 المرحلة '+l);hud()});
    sock.on('evt',function(e){
      if(e.t==='revive'){toast('🤝 نقزتي صاحبك!');progress('revive',1)}
      else if(e.t==='lift'){toast('🛗 وصلتي للسانسور');progress('lift',1)}
      else if(e.t==='down'){toast('😵 غرقتي! تسنى شي واحد ينقزك')}
      else if(e.t==='shield'){toast('🛡 الدرع حماك!')}
    });
    sock.on('snap',function(d){
      lvl=d.lvl;mon.x=d.m[0];mon.l=d.m[1];
      var seen={};count=d.p.length;
      d.p.forEach(function(a){
        seen[a[0]]=1;var e=ent[a[0]];
        if(!e)e=ent[a[0]]={rx:a[1]};
        e.x=a[1];e.l=a[2];e.s=a[3];e.inv=a[4];e.rv=a[5];e.n=a[6];e.c=a[7];
      });
      for(var k in ent)if(!seen[k])delete ent[k];
      hud();
    });
    sock.on('disconnect',function(){joined=false;$('menu').classList.remove('hide');$('ctl').classList.add('hide');$('msg').textContent='تقطع الاتصال'});
  };
  document.head.appendChild(s);
}
$('nm').value=save.name||'';
$('play').onclick=function(){save.name=($('nm').value||'لاعب').trim();persist();if(sock&&sock.connected){sock.emit('join',{name:save.name,skills:save.skills})}else connect()};
// ---------- input ----------
var dx=0,held={l:0,r:0};
function setDx(){var n=held.r-held.l;if(n!==dx){dx=n;if(sock)sock.emit('input',{dx:dx})}}
function hold(id,key){var b=$(id);
  ['pointerdown'].forEach(function(ev){b.addEventListener(ev,function(e){e.preventDefault();held[key]=1;setDx()})});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){b.addEventListener(ev,function(){held[key]=0;setDx()})});}
hold('bL','l');hold('bR','r');
function lane(d){if(sock)sock.emit('lane',{d:d})}
$('bU').addEventListener('pointerdown',function(e){e.preventDefault();lane(-1)});
$('bD').addEventListener('pointerdown',function(e){e.preventDefault();lane(1)});
window.addEventListener('keydown',function(e){
  if(e.repeat)return;var k=e.key;
  if(k==='ArrowLeft'||k==='a'){held.l=1;setDx()}else if(k==='ArrowRight'||k==='d'){held.r=1;setDx()}
  else if(k==='ArrowUp'||k==='w')lane(-1);else if(k==='ArrowDown'||k==='s')lane(1);
});
window.addEventListener('keyup',function(e){var k=e.key;
  if(k==='ArrowLeft'||k==='a'){held.l=0;setDx()}else if(k==='ArrowRight'||k==='d'){held.r=0;setDx()}});
// ---------- render ----------
var cv=$('cv'),ctx=cv.getContext('2d'),W=360,H=640,dpr=1;
function size(){dpr=Math.min(window.devicePixelRatio||1,2);var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',size);size();
var LH=96;function ly(l){return H*0.5-LH*1.5+l*LH}
var last=performance.now();
function frame(now){
  var dt=Math.min((now-last)/1000,.1);last=now;
  ctx.clearRect(0,0,W,H);
  var me=ent[myId];
  for(var k in ent){var e=ent[k];e.rx+=(e.x-e.rx)*Math.min(1,dt*14);e.ry=(e.ry==null?e.l:e.ry)+(e.l-(e.ry==null?e.l:e.ry))*Math.min(1,dt*14)}
  mon.rx+=(mon.x-mon.rx)*Math.min(1,dt*14);mon.rl=(mon.rl==null?mon.l:mon.rl)+(mon.l-mon.rl)*Math.min(1,dt*10);
  if(me&&me.s===0&&joined){var mv=Math.abs(me.x-(me.px==null?me.x:me.px));if(mv<30)progress('run',mv/10);progress('survive',dt)}
  if(me)me.px=me.x;
  var cam=me?Math.max(0,Math.min(WORLD+60-W,me.rx-W*0.35)):0;
  // corridors
  for(var l=0;l<LANES;l++){
    var y=ly(l);ctx.fillStyle=l%2?'#1c2233':'#222a40';ctx.fillRect(0,y,W,LH-8);
    ctx.fillStyle='rgba(255,255,255,.06)';
    for(var x=-((cam)%80);x<W;x+=80)ctx.fillRect(x,y+4,40,4);
  }
  // elevator
  var ex=WORLD-cam;ctx.fillStyle='#4fe3b0';ctx.fillRect(ex,ly(0),50,LH*LANES-8);
  ctx.fillStyle='#0a3a2c';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('🛗',ex+25,ly(1)+50);
  // players
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var id in ent){
    var p=ent[id],px=p.rx-cam,py=ly(p.ry)+LH/2-4;
    if(px<-40||px>W+40)continue;
    ctx.globalAlpha=p.inv?0.55:1;
    ctx.font='30px serif';ctx.fillText(p.s===1?'😵':p.s===2?'😎':'🏃',px,py);
    ctx.globalAlpha=1;
    ctx.fillStyle=p.c||'#fff';ctx.beginPath();ctx.arc(px,py+26,5,0,7);ctx.fill();
    ctx.font='11px sans-serif';ctx.fillStyle=id===myId?'#ffc83d':'#fff';ctx.fillText(p.n+(id===myId?' (أنا)':''),px,py-28);
    if(p.s===1&&p.rv>0){ctx.strokeStyle='#4fe3b0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(px,py,24,-1.57,-1.57+6.28*p.rv);ctx.stroke()}
  }
  // monster
  var mx=mon.rx-cam,my=ly(mon.rl)+LH/2-4;
  ctx.font='56px serif';ctx.fillStyle='#fff';ctx.fillText('👹',mx,my);
  requestAnimationFrame(frame);
}
hud();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
